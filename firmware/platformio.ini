; PlatformIO project for the OpenSmell universal e-nose firmware.
;
; CADENCE
; -------
; The nominal sample period is set at build time, not hardcoded in the source.
; The default is 500 ms (2 Hz), which is the cadence measured on all 13
; reference recordings in ~/Osmograph_Recordings. SAMPLING_CONTRACT.md in the
; repository root is the single source of truth; keep the two in sync.
;
; Build a faster variant, for example:
;   pio run -e esp32-wifi --project-option="build_flags=-DOSMOGRAPH_SAMPLE_INTERVAL_MS=100"
;
; Every environment sets it explicitly rather than relying on the source
; default, so the cadence of a given build is readable from the config.
;
; Any consumer of the serial stream should read the declared cadence from the
; `INFO` line emitted at boot rather than assuming a value:
;   INFO,universal-esp32,1.0.0,<pin_count>,interval_ms=<MS>

[platformio]
default_envs = esp32-wifi

[env]
monitor_speed = 115200
upload_speed = 460800
board_build.f_flash = 40000000L

; src/main.cpp is the universal firmware: it drives USB serial and the WiFi AP
; at the same time. There is no serial-only variant in this repository, so both
; envs below build the same source and differ only in linked libraries. An
; earlier esp32-serial entry pointed at src/serial_main.cpp, which does not
; exist, so that env could not have built.
[env:esp32-serial]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<src/main.cpp>
build_flags =
    -DOSMOGRAPH_SAMPLE_INTERVAL_MS=500

[env:esp32-wifi]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DOSMOGRAPH_SAMPLE_INTERVAL_MS=500

[env:esp32-ble]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<variants/ble_main.cpp>
build_flags =
    -DOSMOGRAPH_SAMPLE_INTERVAL_MS=500